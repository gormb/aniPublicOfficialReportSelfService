name: Sync Google Presentation to PDF

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sync-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Export Presentation to PDF
        run: |
          curl -L "https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/export/pdf" -o "aniPublicOfficialReportSelfService_Html/wwwroot/Book/LifeDemandedDeath.pdf"

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aniPublicOfficialReportSelfService_Html/wwwroot/Book/LifeDemandedDeath.pdf
          
          if git diff --staged --quiet; then
            echo "No changes in Google Presentation."
          else
            git commit -m "auto: update LifeDemandedDeath.pdf from Google Slides [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi
