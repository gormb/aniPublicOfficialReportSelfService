<html>
    <head>
        <title>Life demanded Death</title>
        <script type="module" src="LdD.js"></script>
        <link rel="stylesheet" href="LdD.css">
        <script>
            const uisz=()=>book.sz(window.innerWidth,window.innerHeight);
            const uishow=(c,on)=>{c.style.display=on?'block':'none';return on;}
            const book= {
                s:(pdf,src)=>{
                    nav.DisButtons();
                    book.pdf=pdf;
                    book.src=src;
                    uishow(_fBook,!uishow(_cBook,pdf))
                    nav.UpdButtons();
                    return pdf?book.sPdf(src):book.sExt(src);
                }
                ,sExt:src=> _fBook.src=src
                ,sPdf:async src=>await window.cBook.DoShow(src, 3, window.innerWidth*2)
                ,aRatio:(2*4.13)/5.83 // Golden ratio
                ,szWH:(w,h)=>{
                    _fBook.style.width = w+'px';
                    _fBook.style.height = h+'px';
                    _cBook.width = w;
                    _cBook.height = h;
                    //window.cBook.Width(window.innerWidth*2, true);
                    book.hAlign.Scroll();
                }
                ,szW:w=>book.szWH(w,w/book.aRatio)
                ,sz:(w,h)=>{
                    if(book.pdf) return book.sPdf(book.src);
                    w*=2; // Adjust so double as wide as needed (so that iframe and canvas only show half!)
                    h=h-_dBook.offsetTop;
                    book.szW(w);
                }
                ,hAlign:{
                    _:true
                    ,L:l=> {
                        book.hAlign._=l;
                        nLg.innerText=l?'🇳🇴':'🇬🇧';
                        _fBook.style.left=(l?0:(_dBook.clientWidth-_fBook.offsetWidth))+'px';
                        book.hAlign.Scroll();
                    }
                    ,Scroll:()=>_dBook.scrollLeft=book.hAlign._?0:_dBook.scrollWidth-_dBook.clientWidth
                }
                ,Page:pn=>{console.log(pn); cBook.Page(pn, true)}
                ,pn:()=>cBook.pn
                ,np:()=>cBook.pdf?.numPages
            }
            const nav={
                Able:(c, en)=>{c.classList.toggle('disabled', !en);return en;}
                ,UpdButtons:()=>{
                    nav.Able(nPv, nav.Able(nFt, (book.pn()>1)));
                    nav.Able(nUp, (book.pn()>1) /* or not top of page*/);
                    nav.Able(nGo, false);
                    nav.Able(nDn, (book.pn()<book.np()) /* or not bottom of page*/);
                    nav.Able(nLt, nav.Able(nNt, (book.pn()<book.np())));
                    nav.Able(nFd, false);
                    nav.Able(nEx, false);
                    nav.Able(nTc, false);
                }
                ,DisButtons:()=>nav.Able(nPv, nav.Able(nFt, nav.Able(nUp, nav.Able(nGo, nav.Able(nDn, nav.Able(nLt, nav.Able(nNt, nav.Able(nFd
                            , false))))))))
                ,Share:s=>{
                    uishow(_dBook,!uishow(_dShare,s));
                    nav.Able(nLg, nav.Able(nSh, !s));
                    if (s) 
                        nav.DisButtons();
                    else 
                        nav.UpdButtons();
                }
                ,Page:async pn=>{
                    nav.DisButtons();
                    await cBook.Page(pn, true);
                    window.scrollTo(window.scrollX, 0);
                    nav.UpdButtons();                    
                }
                ,Scroll:async down=>{
                    if (down) {
                        window.scrollTo(window.scrollX, 0);
                    }
                    else { // up
                        window.scrollTo(window.scrollX, 0);
                    }
                }
            }
            async function loaded() {
                //book.s(0,'https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/embed?start=false&loop=false&rm=minimal');
                uisz();
                await book.s(1,'LifeDemandedDeath.pdf');
                uisz();
                nav.UpdButtons();
            }
            window.onresize=uisz;
        </script>
    </head>
    <body onload="loaded()">
        <div class="bookControls" style="z-index:1">
            <button id="nFt" onmousedown="nav.Page(1)">⏮️</button>
                <button id="nPv" onmousedown="nav.Page(book.pn()-1)">◀️</button>
                <button id="nUp" class="disabled" onmousedown="nav.pageUp()">⏫</button>
            &nbsp;&nbsp;<button id="nGo" class="disabled" onmousedown="nav.gotoPage()">🔢</button>
                <button id="nDn" class="disabled" onmousedown="nav.pageDown()">⏬</button>
                <button id="nNt" onmousedown="nav.Page(book.pn()+1)">▶️</button>
                <button id="nLt" onmousedown="nav.Page(book.np())">⏭️</button>
            &nbsp;&nbsp;<button id="nFd" class="disabled" onmousedown="nav.find()">🔍</button>
                <button id="nSh" onmousedown="nav.Share(true)">📲</button>
                <button id="nEx" class="disabled" onmousedown="nav.export()">📤</button>
            <button id="nLg" onmousedown="book.hAlign.L(!book.hAlign._)">🇳🇴</button>
            &nbsp;&nbsp;<button id="nTc" class="disabled" onmousedown="nav.showTOC()">📚</button>
            <hr/>
        </div>
        <div id="_dBook" class="bookParent">
            <iframe id="_fBook" frameborder="0" allowfullscreen></iframe>
            <canvas id="_cBook"></canvas>
        </div>
        <div id="_dShare" class="shareParent">
            <center>
                <img id="qr" class="qr" src="qr.png" onclick="nav.Share(false);"/>
                <a href="https://gormb.github.io/aniPublicOfficialReportSelfService/aniPublicOfficialReportSelfService_Html/wwwroot/Book">
                <h1>Book</h1>
            </center>
            </a>
        </div>
    </body>
</html>
