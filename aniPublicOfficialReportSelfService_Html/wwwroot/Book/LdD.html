                }
                ,szW:w=>book.szWH(w,w/book.aRatio)
                ,sz:(w,h)=>{
                    w*=2; // Adjust so double as wide as needed (so that iframe and canvas only show half!)
                    book.szWH(w,w/book.aRatio);
                    if(book.pdf) return window.cBook.Width(w,true); // re-render at new size – return promise for load chain
                }
                ,hAlign:{
                    _:true
                    ,L:l=>{
                        book.hAlign._=l;
                        nav.memSet('lang', l);
                        nLg.innerText=l?'🇳🇴':'🇬🇧';
                        _fBook.style.left=(l?0:(_dBook.clientWidth-_fBook.offsetWidth))+'px';

                    }
                    ,Load:async()=>{
                        let v=(await nav.memGet('lang', new String(book.hAlign._))=="true") ;

                }
                ,prem:{
                    _:false // true=premium, false=freemium
                    ,ui:(l=book.prem._)=>{ // button-only UI, no re-render / TOC work (used at load, before first paint)
                        nPr.innerText=l?'👑':'🔓';
                        if(nMt.innerText=='⏷')nPr.style.display=l?'none':'inline'; // floating 🔓 only in freemium (outside menu)
                        return l;
                    }
                    ,L:async l=>{
                        book.prem._=l;
                        nav.memSet('prem', l);
                        book.prem.ui(l);
                        if(_dToc.style.display!='none')_dTocList.innerHTML=await nav.Toc(); // TOC open → rebuild with new mode

                        nav.UpdButtons();
                        window.cBook&&window.cBook.pdf&&window.cBook.Page(window.cBook.pn, true); // re-render in new mode (PDF must be loaded)
                    }
                    ,Load:async()=>{
                        // Re-validate stored code against server in background (never blocks first view); revoke if over device limit.
                        const code=await nav.memGet('code','');
                        if(!code)return; // no stored code – keep current mode (backward compatible)
                        const r=await nav.StillValid(code); // "still OK?" – rolling window / limit
                        if(r===undefined||r===null)return; // db.js unavailable – don't conclude
                        const ok=r===true||!!(r&&r.ok); // supports old bool and new {ok} object
                        if(ok){if(!book.prem._)book.prem.L(true);} // still OK → premium (silent)
                        else if(book.prem._){ // not OK (over limit / expired) → revoke + ask for code again
                            if(r.reason!=='error'&&r.reason!=='connection'&&r.reason!=='noconfig')
                                nav.memSet('code',''); // revoke stored code → must re-enter (network errors don't punish user)
                            book.prem.L(false);
                            nav.PinOpen();
                        }
                    }
                }
                ,Page:async pn=>{                    
                    nGoTxt.value = pn;
                    await cBook.Page(pn, true);
                }
                ,src:"b/LifeDemandedDeath/b.pdf"
                ,srcBase:()=>{ return book.src.replace(/\.pdf$/i,"");} // keep folder (b/...) so sidecars (.jpg/.png) sit next to the book
                ,name:()=>{const p=book.src.split("/");return p.length>2?p[p.length-2]:p[p.length-1].replace(/\.pdf$/i,"")} // nested: identity = parent folder
                ,pn:()=>cBook.pn

            }

                    { forlag: "Hikuin Forlag", url: "mailto:post@hikuin.no", forlagstype: "Kultur / Filosofi / Småforlag", punktromscore: 3 },
                    { forlag: "Efrem Forlag", url: "mailto:post@efremforlag.no", forlagstype: "Kultur / Eksistensielt", punktromscore: 3 },
                    { forlag: "Tranby Forlag", url: "mailto:post@tranbyforlag.no", forlagstype: "Kultur / Småforlag", punktromscore: 2 },
                    { forlag: "Gasspedal", url: "mailto:gasspedal@gasspedal.org", forlagstype: "Avantgarde / Eksperimentelt", punktromscore: 6 },
                    { forlag: "House of Foundation / H//O//F", url: "mailto:kontakt@houseoffoundation.no", forlagstype: "Eksperimentell litteratur", punktromscore: 6 },
                    { forlag: "Bokvennen Forlag", url: "mailto:post@solumbokvennen.no", forlagstype: "Skjønnlitteratur / Klassikere", punktromscore: 4 }
                ]

            const GEST=Object.freeze({ // ENUM: gesture states
                NONE:'none', BUSY:'busy'
                ,UP:'up', DN:'dn', LEFT:'left', RIGHT:'right'
                ,PGUP:'pgup', PGDN:'pgdn'
            });
            const nav={
                Able:(c, en)=>{c.classList.toggle('disabled', !en);return en;}
                ,UpdButtons:()=>{
                    const canPrev=book.pn()>1, canNext=book.pn()<book.np();
                    nav.Able(nFt, canPrev); nav.Able(nPv, canPrev);
                    nav.Able(nNt, canNext); nav.Able(nLt, canNext);
                    uishow(nUp2, uishow(nUp3, !book.whole && canPrev)) | uishow(nPv3, uishow(nPv2, book.whole && canPrev));
                    uishow(nNt2, canNext); uishow(nNt3, canNext);
                    nav.Able(nUp, (canPrev || window.scrollY > 0));
                    nav.Able(nGo, true);
                    nav.Able(nDn, (canNext || window.scrollY < document.documentElement.scrollHeight - window.innerHeight));
                    //nav.Able(nFd, false);
                    nav.Able(nEx, book.prem._); // export only in premium
                    nav.nShFit(); // hide nSh only if nPv2/nPv3 overlap it visually
                }
                ,nShFit:()=>{ // hide nSh only if ◄ (nPv2/nPv3) overlaps it vertically
                    const b=[nPv2,nPv3].find(b=>b.style.display!='none');
                    nSh.style.display=nMt.innerText=='⏷'&&b&&b.getBoundingClientRect().bottom>nSh.getBoundingClientRect().top?'none':'';
                }
                ,DisButtons:()=>nav.Able(nPv, nav.Able(nFt, nav.Able(nUp, nav.Able(nGo, nav.Able(nDn, nav.Able(nLt, nav.Able(nNt, uishow(nNt2, uishow(nUp2, uishow(nNt3, uishow(nUp3
                            , false)))))))))))
                ,Share_preX:0
                ,Share:async (_,s=_??_dShare.style.display=='none')=>{
                    if (s) {
                        book.Share_preX = window.scrollX;
                        cBook.QrUrlScrollY = window.scrollY; // save vertical position for QR link
                    }
                    uishowBlock(_dShare,!uishow(nUp2,uishow(nUp3,uishow(nNt2,uishow(nNt3,uishow(_cBook,nav.Able(nLg, !s)))))));
                    if (s) {
                        nav.DisButtons();
                        shLgLbl.style.display = book.hAlign._ ? 'none' : ''; // nLg only relevant in English
                        qrA.href = await window.cBook.QrUrl(false,35,book.srcBase()+".png");
                        await nav.QrDeep();
                        window.scrollTo(window.scrollX, 0);
                    } else {
                        window.scrollTo(book.Share_preX, cBook.QrUrlScrollY);
                        nav.UpdButtons();
                    }
                }
                ,QrDeep:async ()=>{
                    qrdA.href = await window.cBook.QrUrl(true,35,book.srcBase()+"2.png",{
                        book:shBook.checked
                        ,page:shPage.checked
                        ,pos:shPos.checked
                        ,idx:shIdx.checked
                        ,lang:shLg.checked
                    });
                }
                ,Export_preX:0,Export_preY:0
                ,Export:async (_,s=_??_dExport.style.display=='none')=>{
                    if(!book.prem._)return; // export only in premium
                    uishow(nSv, false);
                    if (s) {
                        book.Export_preX = window.scrollX;
                        book.Export_preY = window.scrollY;
                    }
                    console.log("nav.Export", s);
                    uishowBlock(_dExport,!uishow(nUp2,uishow(nUp3,uishow(nNt2,uishow(nNt3,uishow(_cBook,nav.Able(nLg, !s)))))));
                    if (s) {
                        nav.DisButtons();
                        window.scrollTo(window.scrollX, 0);
                        _dExportTxt.innerHTML = "Exporting...";
                        _dExportTxt.innerHTML = await window.cBook.Export(1, 1, !book.hAlign._);
                        _dExportTxt.innerHTML += await window.cBook.Export(2, window.cBook.pdf?.numPages, !book.hAlign._);
                        uishow(nSv, true);
                    } else {
                        window.scrollTo(book.Export_preX, book.Export_preY);
                        nav.UpdButtons();
                    }
                }
                ,ExportSave:async()=>{
                    const blob = new Blob([_dExportTxt.innerText], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${book.name()}_${book.hAlign._?'N':'E'}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                ,Page:async(pn,x)=>{
                    //nav.DisButtons();
                    nav.memSet('page', pn);
                    await book.Page(pn);
                    if (x!=null) 
                        window.scrollTo(window.scrollX, x);
                    nav.UpdButtons();
                    window.db?.logUsage&&window.db.logUsage({event:'page',book:book.name(),page:pn}); // log page visit to `usage`
                }
                ,EdPage:async()=>{
                    nGoTxt.value = book.pn();
                    uishow(nGoTxt,!uishow(nGo, false));
                    nGoTxt.focus(); // sync focus within the user gesture => iOS shows keyboard
                    nGoTxt.select();
                }
                ,PageEd:async ()=>{
                    const n = parseInt(nGoTxt.value);
                    if (!isNaN(n))
                        await nav.Page(n, 0);
                    uishow(nGoTxt,!uishow(nGo, true));
                }
                ,ScrollUp:async(top=nav.gest.ontop())=>{
                    if (top) {// already at top
                        await nav.Page(book.pn() - 1, _dBook.scrollHeight - window.innerHeight); // scroll to bottom of previous page
                        //window.scrollTo(window.scrollX, document.documentElement.scrollHeight - window.innerHeight);
                    }
                    else window.scrollBy(0, -window.innerHeight*.75);
                    nav.UpdButtons();
                }
                ,ScrollDn:async()=>{
                    if (window.scrollY >= document.documentElement.scrollHeight-window.innerHeight - 1) {
                        await nav.Page(book.pn() + 1, 0); // nav.Page scrolls to top itself
                    }
                    else
                        window.scrollBy(0, window.innerHeight*.75);
                    nav.UpdButtons();
                }
                // nav.gest = gestyr. Tilstandsmaskin: none | busy | up | dn | left | right | pgup | pgdn
                ,gest:{
                    _edge:0.02 // edge margin as fraction of viewport height: 0.02 = 2% from top/bottom
                    ,_ratio:2 // axis dominance: horizontal needs |dx|>2·|dy|, vertical needs |dy|>2·|dx|; diagonal = native scroll
                    ,ontop:()=>window.scrollY<=window.innerHeight*nav.gest._edge
                    ,onbottom:()=>window.scrollY>=document.documentElement.scrollHeight-window.innerHeight-window.innerHeight*nav.gest._edge
                    ,suppressed:()=>_dToc.style.display!='none'||_dShare.style.display!='none'||_dExport.style.display!='none' // TOC/share/export open → never gesture (native scroll)
                    ,newState:GEST.NONE
                    ,lastState:GEST.NONE
                    ,_d:0 // last direction key: 'dn'|'up'|'left'|'right' (0=none)
                    ,_pg:0 // pending page-changes (await) – stays busy until done
                    ,_t:0
                    ,_ms:Date.now()
                    // detectState: pure decision – which state? no side effects.
                    // For now: only HORIZONTAL (left/right) flips pages. Vertical scrolls only – never flips.
                    ,detectState:(d,horiz,touch)=>{
                        const g=nav.gest;
                        if (g.newState!==GEST.NONE) return g.newState; // keep – one decision per gesture
                        if (horiz) return d>0?GEST.RIGHT:GEST.LEFT;    // sideways → prev/next page (only page flip)
                        return d>0?GEST.DN:GEST.UP;                    // vertical → scroll only (PGUP/PGDN disabled for now)
                    }
                    ,isPage:ns=>ns===GEST.PGUP||ns===GEST.PGDN||ns===GEST.LEFT||ns===GEST.RIGHT // page operation (needs busy/await)
                    // setState owns all state changes + stop detection (setTimeout)
                    ,setState:(ns)=>{
                        const g=nav.gest;
                        const now=Date.now();
                        clearTimeout(g._t); // cancel any previous stop detection
                        if (ns===g.newState){ // no change – just defer stop detection (still in gesture)
                            if (ns!==GEST.NONE && !g.isPage(ns)) g._t=setTimeout(()=>{g._d=0; g.setState(GEST.NONE);},200);
                            return;
                        }
                        g.lastState=g.newState;
                        g.newState=ns;
                        console.log('wheel', g.lastState, '('+(now-g._ms)+')', '->', g.newState);
                        g._ms=now;
                        g.stateUi(); // state symbol on the page number
                        if (ns!==GEST.NONE && !g.isPage(ns)) g._t=setTimeout(()=>{g._d=0; g.setState(GEST.NONE);},200);
                    }
                    // unique unicode symbol per state (none = blank)
                    ,SYMBOLS:{'none':' ','busy':'…','up':'↑','dn':'↓','left':'←','right':'→','pgup':'⇑','pgdn':'⇓'}
                    ,stateUi:()=>{ // state symbol by page number + mirrored fixed at mid left/right edges
                        const g=nav.gest;
                        const s=g.SYMBOLS[g.newState]||' ';

                    await uisz(); // await render (offscreen → one swap) – full file done before spinner hides
                    uishow(_iBook, false); // bg image – hide once page painted (else covers book until Loaded ends)
                    await book.hAlign.Load();
                    // Note: book.prem.Load() deliberately removed from load sequence – never runs before first view (mode already set above)
                    const commands=sp.get('c')?.split(',') || [];
                    const musicCommand=commands.find(c=>c.startsWith('m')&&c!=='menu');
                    if(musicCommand) {
                    scY=0; // music nav always scrolls to top
                        await nav.MusicPage(musicCommand);
                    }
                    nav.btSimul(commands, 0);
                    window.scrollTo(window.scrollX, scY);
                    nav.UpdButtons();
                    uishow(iLoading, false)
                    _busy=false;
                    // Background reconcile after page visible – normally a no-op; never blocks first view
                    setTimeout(()=>{book.prem.Load().catch(e=>console.error('[prem]',e));},0);
                    // Background PIN recheck: drop to freemium if others took over; interval = book's premiumCheckInterval (default 60s)
                    const premSec=await nav.BookInterval() ?? 60;
                    setInterval(()=>{nav.RecheckPin().catch(e=>console.error('[recheck]',e));},premSec*1000);
                }
            }
            const spAnchor=(el)=>{ // player sits inline under the chapter row in TOC – TOC builds once so it survives re-enter
                const f=el||document.getElementById('_spPlayer');
                if(!f||f.style.display==='none'||!f.dataset.u)return;
                const b=[...document.querySelectorAll('#_dTocList a.toc-play')].find(a=>a.dataset.u===f.dataset.u);
                if(b){b.closest('li').insertAdjacentElement('afterend',f);}
                f.style.cssText='display:block;width:min(60vw,70vh);height:min(16vw,18.6vh);margin:.4em 0 .5em 1.5em;border:0;border-radius:1vw;';
            };
            window.spAnchor=spAnchor;
            window.spTgl=(...args)=>nav.spTgl(...args);
            async function loaded() {
                nav.menu(false);
                // auto lang-swap on horizontal scroll removed – language only via nLg button
                window.addEventListener('wheel',nav.gest.wheel,{passive:false}); // gesture: one decision per scroll; swallow momentum after page change
                // touch (iPhone): iOS gives no wheel on touch-scroll → translate to synthetic wheel events for the same gesture machine
                let _tX=0,_tY=0,_tA=0,_tSX=0,_tSY=0; // _tA: locked axis (1=horizontal, 0=ambiguous/native, -1=vertical)
                document.addEventListener('touchstart', e=>{
                    const t=e.touches[0]; _tX=t.clientX; _tY=t.clientY; _tA=0; _tSX=0; _tSY=0;
                }, {passive:true});
                document.addEventListener('touchmove', e=>{
                    const g=nav.gest;
                    if(g.suppressed()){_tA=0;_tSX=0;_tSY=0;_tX=e.touches[0].clientX;_tY=e.touches[0].clientY;return;} // TOC/modal open: no gesture – native scroll
                    const t=e.touches[0], dx=t.clientX-_tX, dy=t.clientY-_tY;
                    _tX=t.clientX; _tY=t.clientY;
                    if(_tA===0){ _tSX+=dx; _tSY+=dy; if(Math.abs(_tSX)>30||Math.abs(_tSY)>30) _tA=Math.abs(_tSX)>Math.abs(_tSY)*nav.gest._ratio?1:Math.abs(_tSY)>Math.abs(_tSX)*nav.gest._ratio?-1:0; } // lock axis only at 2× dominance (>30px); diagonal → 0 = no gesture (native scroll)
                    if(_tA===1){ // horizontal swipe → page flip
                        if(g.isPage(g.newState)||g.newState===GEST.BUSY) e.preventDefault();
                        nav.gest.wheel({ deltaX:dx, deltaY:0, touch:true, preventDefault:()=>{} });
                    } // vertical (_tA=-1): don't touch machine – native scroll
                }, {passive:false});
                document.addEventListener('mousedown', (e)=>{
                    if(e.target.closest('#_spCollapse, #_dPlay, #_spPlayer, .toc-play'))return; // music – don't show nav
                    nav.uiHide(false); // click on book/text → show nav again
                }, true);
                nav.idleReset(); // start inactivity timer (5s)
                await nav.Loaded(); // load book, adjust size and update buttons
            }
            let _rsz;
            window.onresize=()=>{clearTimeout(_rsz);_busy=true;_rsz=setTimeout(()=>{uisz();nav.UpdButtons();_busy=false},250)}; // wait for quiet before resize (iOS)
            window.onscroll=uiscroll;
        </script>
    </head>
