                    { forlag: "Flamme Forlag", url: "mailto:manus@flammeforlag.no", forlagstype: "Kortprosa / Poesi / Eksperimentelt", punktromscore: 6 },
                    { forlag: "Hikuin Forlag", url: "mailto:post@hikuin.no", forlagstype: "Kultur / Filosofi / Småforlag", punktromscore: 3 },
                    { forlag: "Efrem Forlag", url: "mailto:post@efremforlag.no", forlagstype: "Kultur / Eksistensielt", punktromscore: 3 },

                    { forlag: "Gasspedal", url: "mailto:gasspedal@gasspedal.org", forlagstype: "Avantgarde / Eksperimentelt", punktromscore: 6 },
                    { forlag: "House of Foundation / H//O//F", url: "mailto:kontakt@houseoffoundation.no", forlagstype: "Eksperimentell litteratur", punktromscore: 6 },

            const nav={
                Able:(c, en)=>{c.classList.toggle('disabled', !en);return en;}
                ,UpdButtons:()=>{
                    nav.Able(nPv, uishow(nUp2, uishow(nUp3, nav.Able(nFt, (book.pn()>1)))));
                    nav.Able(nUp, (book.pn()>1 || window.scrollY > 0));
                    nav.Able(nGo, true);
                    nav.Able(nDn, (book.pn()<book.np() || window.scrollY < document.documentElement.scrollHeight - window.innerHeight));
                    nav.Able(nLt, nav.Able(nNt, uishow(nNt2, uishow(nNt3, (book.pn()<book.np())))));
                    nav.Able(nFd, false);
                }
                ,DisButtons:()=>nav.Able(nPv, nav.Able(nFt, nav.Able(nUp, nav.Able(nGo, nav.Able(nDn, nav.Able(nLt, nav.Able(nNt, nav.Able(nFd, uishow(nNt2, uishow(nUp2, uishow(nNt3, uishow(nUp3
                            , false))))))))))))
                ,Share_preX:0
                ,Share:async (_,s=_??_dShare.style.display=='none')=>{
                    if (s) {
                        book.Share_preX = window.scrollX;
                        cBook.QrUrlScrollY = window.scrollY; // save vertical position for QR link
                    }
                    uishowBlock(_dShare,!uishow(nUp2,uishow(nUp3,uishow(nNt2,uishow(nNt3,uishow(_cBook,nav.Able(nLg, !s)))))));
                    if (s) {
                        nav.DisButtons();
                        qrA.href = await window.cBook.QrUrl(false,35,book.srcBase()+".png");
                        qrdA.href = await window.cBook.QrUrl(true,35,book.srcBase()+"2.png");
                        window.scrollTo(window.scrollX, 0);
                    } else {
                        window.scrollTo(book.Share_preX, cBook.QrUrlScrollY);
                        nav.UpdButtons();
                    }
                }
                ,Export_preX:0,Export_preY:0
                ,Export:async (_,s=_??_dExport.style.display=='none')=>{
                    uishow(nSv, false);
                    if (s) {
                        book.Export_preX = window.scrollX;
                        book.Export_preY = window.scrollY;
                    }
                    console.log("nav.Export", s);
                    uishowBlock(_dExport,!uishow(nUp2,uishow(nUp3,uishow(nNt2,uishow(nNt3,uishow(_cBook,nav.Able(nLg, !s)))))));
                    if (s) {
                        nav.DisButtons();
                        window.scrollTo(window.scrollX, 0);
                        _dExportTxt.innerHTML = "Exporting...";
                        _dExportTxt.innerHTML = await window.cBook.Export(1, 1, !book.hAlign._);
                        _dExportTxt.innerHTML += await window.cBook.Export(2, window.cBook.pdf?.numPages, !book.hAlign._);
                        uishow(nSv, true);
                    } else {
                        window.scrollTo(book.Export_preX, book.Export_preY);
                        nav.UpdButtons();
                    }
                }
                ,ExportSave:async()=>{
                    const blob = new Blob([_dExportTxt.innerText], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `LifeDemandedDeath_${book.hAlign._?'N':'E'}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                ,Page:async pn=>{
                    //nav.DisButtons();
                    nav.memSet('page', pn);
                    await book.Page(pn);
                    window.scrollTo(window.scrollX, 0);
                    nav.UpdButtons();
                }
                ,EdPage:async()=>{
                    nGoTxt.value = book.pn();
                    uishow(nGoTxt,!uishow(nGo, false));
                    nGoTxt.focus(); // sync focus within the user gesture => iOS shows keyboard
                    nGoTxt.select();
                }
                ,PageEd:async ()=>{
                    const n = parseInt(nGoTxt.value);
                    if (!isNaN(n))
                        await nav.Page(n);
                    uishow(nGoTxt,!uishow(nGo, true));
                }
                ,ScrollUp:async ()=>{
                    if (window.scrollY <= 1) {// already at top
                        await nav.Page(book.pn() - 1);
                        window.scrollTo(window.scrollX, document.documentElement.scrollHeight - window.innerHeight);
                    }
                    else {
                        window.scrollBy(0, -window.innerHeight*.75);
                    }
                    nav.UpdButtons();
                }
                ,ScrollDn:async()=>{
                    if (window.scrollY >= document.documentElement.scrollHeight-window.innerHeight - 1) {
                        await nav.Page(book.pn() + 1);
                        window.scrollTo(window.scrollX, 0);
                    }
                    else
                        window.scrollBy(0, window.innerHeight*.75);
                    nav.UpdButtons();
                }
                ,ShowToc:async (s=_dToc.style.display=='none')=>{
                    if(s){
                        if(!_dTocList.childElementCount)_dTocList.innerHTML=await nav.Toc(); // bygg TOC bare ÉN gang – ingen reset ved re-enter
                        // oppdater 'cur'-merking til nåværende side (uten gjenoppbygging, så spilleren ikke resettes)
                        const cp=book.pn(); let curPage=0;
                        [..._dTocList.querySelectorAll('li')].forEach(li=>{const p=+li.dataset.p||0;if(p&&p<=cp&&p>curPage)curPage=p;});
                        _dTocList.querySelectorAll('.cur').forEach(a=>a.classList.remove('cur'));
                        _dTocList.querySelectorAll(`li[data-p="${curPage}"] .toc-nav`).forEach(a=>a.classList.add('cur'));
                        nav._menuWasOpen=nMt.innerText=='⏶';
                        if(nav._menuWasOpen)nav.menu();
                    }else if(nav._menuWasOpen)nav.menu();
                    uishowBlock(_dToc,s)&&nav.DisButtons();
                    uishowBlock(_dBook,!s)&&nav.UpdButtons();
                    nav.Able(nLg,!s); // nLg deaktivert i TOC
                    if(s){const cur=_dTocList.querySelector('.cur'); if(cur)cur.scrollIntoView({block:'center'});} // vis nåværende side
                }
                ,TocPage:async n=>{
                    nav.ShowToc();
                    nav.Page(n);
                }
                ,spTgl:async(e,ev=window.event)=>{
                    const u=e.dataset?.u||e.href||'', toc=!!e.closest('.toc-play');
                    const stop=()=>{
                        document.querySelectorAll('[data-spotify-play-active]').forEach(b=>{b.style.visibility='';b.removeAttribute('data-spotify-play-active');});
                        const f=document.getElementById('_spPlayer'),c=document.getElementById('_spCollapse');
                        if(f){f.src='about:blank';f.style.display='none';f.title='';}
                        if(c)c.style.display='none';
                    };
                    // ÉN felles spiller som bor INLINE under kapittelet i TOC + ÉN 🎶-stoppknapp
                    let f=document.getElementById('_spPlayer');
                    if(!f){
                        f=document.createElement('iframe');
                        f.id='_spPlayer';f.className='spotify-inline';
                        f.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
                        document.body.appendChild(f);
                    }
                    let c=document.getElementById('_spCollapse');
                    if(!c){
                        c=document.createElement('button');
                        c.id='_spCollapse';c.textContent='🎶';c.title='Stop music';
                        c.style.display='none';c.onmousedown=stop;
                        document.body.appendChild(c);
                    }
                    document.querySelectorAll('[data-spotify-play-active]').forEach(b=>{b.style.visibility='';b.removeAttribute('data-spotify-play-active');});
                    console.log('[Spotify] play clicked', {key:u});
                    const url=await window.cBook.SpotUrl(u);
                    const embed=url.replace('open.spotify.com/','open.spotify.com/embed/');
                    f.dataset.u=url;
                    e.style.setProperty('visibility','hidden','important');
                    e.setAttribute('data-spotify-play-active','');
                    // spilleren bor i TOC – avspilling fra siden åpner TOC så spilleren vises der
                    if(!toc)await nav.ShowToc(true);
                    f.src=embed.includes('open.spotify.com/embed/')?embed:'about:blank';
                    if(f.src==='about:blank'){f.style.border='0.2vw solid #c00';f.title='Music unavailable';}else{f.style.border='0';f.title='';}
                    f.style.display='block'; // spilleren kan ha vært skjult av 🎶 – vis den igjen
                    c.style.display='block';
                    window.spAnchor?.(); // spilleren ligger inline under kapittelet i TOC (fint utseende)
                }
                ,Toc:async ()=>{
                    const T=cBook.data.type, want=book.hAlign._?'no':'en';
                    const data=await cBook.data.get(), last=cBook.pdf.numPages-3;
                    const chaps=data.filter(b=>b.type===T.CHAPTER&&b.lang===want&&b.page<last);
                    const subs=data.filter(b=>b.type===T.SUB&&b.lang===want&&b.page<last);
                    const spotMap=await window.cBook.SpotLoad();
                    const resolveSpot=url=>{
                        if(!url||!window.cBook.SpotRe.test(url))return url;
                        const key=new URL(url).search.slice(1);
                        return spotMap[key]||url;
                    };
                    const music=new Map(data.filter(b=>b.type===T.LINK&&b.spotify).map(b=>[`${b.lang}:${b.page}`,resolveSpot(b.url)]));
                    const musicUrl=page=>music.get(`${want}:${page}`)||'';
                    const cur=book.pn(); // nåværende side
                    let curPage=0; // dypeste overskrift på/foran nåværende side
                    for(let i=0;i<chaps.length;i++){
                        const c=chaps[i], end=chaps[i+1]?.page??1e9;
                        if(c.page<=cur)curPage=c.page;
                        for(const s of subs.filter(x=>x.page>=c.page&&x.page<end)) if(s.page<=cur)curPage=s.page;
                    }
                    const row=(n,t,u,isCur)=>`<a class="toc-nav${isCur?' cur':''}" href="javascript:nav.Page(${n});nav.ShowToc()"><span>${t}</span><i></i></a>`+(u?`<a class="toc-play" id="${new URL(u,location.href).search.slice(1)}_${want==='no'?'l':'r'}" data-u="${u}" onmousedown="nav.spTgl(this,event);return false;" href="#">▶</a>`:'')+`<a class="toc-num" href="javascript:nav.Page(${n});nav.ShowToc()">${n}</a>`;
                    return '<ul>'+chaps.map((c,i)=>{
                        const end=chaps[i+1]?.page??1e9;
                        const cs=subs.filter(s=>s.page>=c.page&&s.page<end);
                        return `<li class="chap" data-p="${c.page}">${row(c.page,c.text,musicUrl(c.page),c.page===curPage)}</li>`+(cs.length?'<ul>'+cs.map(s=>`<li data-p="${s.page}">${row(s.page,s.text,musicUrl(s.page),s.page===curPage)}</li>`).join('')+'</ul>':'');
                    }).join('')+'</ul>';
                }
                ,menu:()=>{
                    let h=nMt.innerText!='⏶';
                    nMt.innerText=h?'⏶':'⏷';
                    document.querySelector('.bookControls').classList.toggle('collapsed', !h);
                    // Adjust scale of share button to fit within menu, set to fixed right if h
                    nSh.style.scale=h?1:.7;
                    nSh.style.position=!h?'fixed':'';
                    nSh.style.bottom=nSh.style.left=!h?'0':'';
                    nSh.classList.toggle('floatingControl', !h);
                    uishow(nLg,uishow(nFt,uishow(nPv,
                        uishow(nUp,uishow(nGo,uishow(nTc,uishow(nDn,
                        uishow(nNt,uishow(nLt,uishow(nFd,uishow(nEx,h))
                        )))))))));
                    // nTc: fast knapp midt på venstre side når menyen er skjult
                    if(!h){nTc.style.position='fixed';nTc.style.left='0';nTc.style.top='50%';nTc.style.transform='translateY(-50%) scale(.7)';nTc.style.display='inline';nTc.style.filter='grayscale(1)';nTc.classList.add('floatingControl');}
                    else{nTc.style.position=nTc.style.right=nTc.style.top=nTc.style.transform=nTc.style.filter='';nTc.classList.remove('floatingControl');}
                    if(cBook.page){cBook.Play();cBook.PageNo();} // siden flytter seg - flytt knapper og sidetall med
                }
                ,btSimul:(a,i)=>{
                    if(i>=a.length) return;
                    const c=a[i], b=document.getElementById(c);
                    const side=c.startsWith('m')&&book.hAlign._?'_l':c.startsWith('m')?'_r':'';
                    const target=b||document.getElementById(c+side);
                    if(target){
                        if(target.onmousedown)target.onmousedown();
                        else target.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true}));
                    }
                    else if(c=="w") return setTimeout(() => nav.btSimul(a, i+2), a[i+1]??1000);
                    else if(c=="s")
                        window.scrollTo(window.scrollX, a[(++i)]);
                    else console.log(`btSimul ${c} button not found`);
                    nav.btSimul(a,i+1);
                }
                ,MusicPage:async key=>{
                    const T=cBook.data.type;
                    const data=await cBook.data.get();
                    const linkKey=url=>{
                        try{return new URL(url).search.slice(1).replace(/qr$/i,'');}
                        catch{return url.split('?')[1]?.replace(/qr$/i,'')||'';}
                    };
                    const link=data.find(b=>b.type===T.LINK&&b.spotify&&linkKey(b.url)===key.replace(/qr$/i,''));
                    console.log('[Spotify] deep-link page lookup', {key, page:link?.page||null, url:link?.url||null});
                    if(link&&book.pn()!==link.page)await nav.Page(link.page);
                }
                ,memGet:async(k,d)=>{
                    let v=localStorage.getItem(`LdD.${k}`) || d;
                    return v;
                }
                ,memSet:async(k,v)=>{localStorage.setItem(`LdD.${k}`, v);return v}
                ,Loaded:async (sp=new URLSearchParams(window.location.search))=>{
                    _busy=true; // undertrykk auto-språkbytte under lasting
                    uisz(); // Set initial size
                    uishow(iLoading, true)
                    let bookU=sp.get('book');
                    if(bookU) nav.memSet('book', bookU);
                    else bookU=await nav.memGet('book', 'LifeDemandedDeath.pdf');
                    let bookT=parseInt(sp.get('bookT')) || parseInt(await nav.memGet('book type', bookU?.indexOf('.pdf')!=-1))
                        ,page=parseInt(sp.get('page')) || parseInt(await nav.memGet('page', 1))
                        ,scY=parseInt(sp.get('y')) || parseInt(await nav.memGet('Y', window.scrollY));
                    await book.s(1,bookU,page); //alt for google doc: book.s(0,'https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/embed?start=false&loop=false&rm=minimal');
                    //await nav.Page(page);
                    uisz();
                    await book.hAlign.Load();
                    const commands=sp.get('c')?.split(',') || [];
                    const musicCommand=commands.find(c=>c.startsWith('m')&&c!=='menu');
                    if(musicCommand) {
                        scY=0; // Navigasjon til musikk skal alltid scrolle til topp
                        await nav.MusicPage(musicCommand);
                    }
                    nav.btSimul(commands, 0);
                    window.scrollTo(window.scrollX, scY);
                    nav.UpdButtons();
                    uishow(iLoading, false)
                    _busy=false;
                }
            }
            const spAnchor=(el)=>{ // spilleren ligger INLINE under kapittel-raden i TOC – TOC bygges bare én gang, så den overlever re-enter uten reset
                const f=el||document.getElementById('_spPlayer');
                if(!f||f.style.display==='none'||!f.dataset.u)return;
                const b=[...document.querySelectorAll('#_dTocList a.toc-play')].find(a=>a.dataset.u===f.dataset.u);
                if(b){b.closest('li').insertAdjacentElement('afterend',f);}
                f.style.cssText='display:block;width:min(60vw,70vh);height:min(16vw,18.6vh);margin:.4em 0 .5em 1.5em;border:0;border-radius:1vw;';
            };
            window.spAnchor=spAnchor;
            window.spTgl=(...args)=>nav.spTgl(...args);
            async function loaded() {
                nav.menu(false);
                _dBook.addEventListener('scroll',aLg); // auto-språkbytte ved horisontal skrolling
                await nav.Loaded(); // Load book, adjust size and update buttons
            }
            let _rsz;
            window.onresize=()=>{clearTimeout(_rsz);_busy=true;_rsz=setTimeout(()=>{uisz();_busy=false},250)}; // vent til ro før resize (iOS)
            window.onscroll=uiscroll;
        </script>
    </head>
    <body onload="loaded()">
        <div class="bookControls" style="z-index:1;text-align:center;">
            <button id="nMt" onmousedown="nav.menu()" style="padding-left:2vw;padding-right:2vw;scale:.7;">⏶</button>
            <button id="nFt" onmousedown="nav.Page(1)">⏮️</button>
                <button id="nPv" onmousedown="nav.Page(book.pn()-1)">◀️</button>
                <button id="nUp" onmousedown="nav.ScrollUp()">⏫</button>
                <button id="nGo" onmousedown="nav.EdPage()">🔢</button>
                    <input id="nGoTxt" class="pageNo" type="text" inputmode="numeric" value="1" onchange="nav.PageEd()" onkeydown="if(event.key=='Enter') nav.PageEd()"/>
                <button id="nDn" onmousedown="nav.ScrollDn()">⏬</button>
                <button id="nNt" onmousedown="nav.Page(book.pn()+1)">▶️</button>
                <button id="nLt" onmousedown="nav.Page(book.np())">⏭️</button>
            &nbsp;&nbsp;<button id="nFd" class="disabled" onmousedown="nav.find()">🔍</button>
                <button id="nSh" onmousedown="nav.Share()">📲</button>
                <button id="nEx" onmousedown="nav.Export()">📤</button>
            <button id="nLg" onmousedown="book.hAlign.L(!book.hAlign._)">🇳🇴</button>
            &nbsp;&nbsp;<button id="nTc" onmousedown="nav.ShowToc()">📚</button>
        </div>
        <div id="_dBook" class="bookParent">
            <img id="iLoading" src="aigap.webp" style="z-index:2;position:fixed;left:47vw;top:47vh;animation:rotate 2s linear infinite;width:6vw">
            <iframe id="_fBook" frameborder="0" allowfullscreen></iframe>
            <canvas id="_cBook"></canvas>
                <button id="nUp2" onmousedown="nav.ScrollUp()" style="display:none;">&nbsp;▲&nbsp;</button>
                <button id="nUp3" onmousedown="nav.ScrollUp()" style="display:none;">&nbsp;▲&nbsp;</button>
                <button id="nNt2" onmousedown="nav.Page(book.pn()+1)" style="display:none;">&nbsp;►&nbsp;</button>
                <button id="nNt3" onmousedown="nav.Page(book.pn()+1)" style="display:none;">&nbsp;►&nbsp;</button>
        </div>
        <div id="_dShare" class="shareParent" style="display:none;">
            <center><table><tr><td>
                <a id="qrA" href="#"><h1>Book</h1></a><td><img id="qr" class="qr" src="failedqr.png"/><hr></td></tr>
                <tr><td><a id="qrdA" href="#"><h1>Deep</h1></a></td><td><img id="qrd" class="qr" src="failedqr.png"/></td></tr></table>
            </center>
        </div>
        <div id="_dToc" class="tocParent" style="display:none;">
                <h1><a href="javascript:nav.TocPage(1);">"Liv Krevde Død"</a></h1>
                <ul id="_dTocList"></ul>
                <hr><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/06f9iQGV6mSzWo4pz20hQB?utm_source=generator&si=9930b284b4684788" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <div id="_dExport" style="display:none;z-index:3">
            <button id="nSv" onmousedown="window.cBook.Save(_dExportTxt)" style="display:none;">💾</button>
            <div id="_dExportTxt" contenteditable="true">
                <b>Book</b><br><br>exporting...<br>
                <br><br><br><hr><br><br><br>
                <b>Bok</b><br>ekporteres...
            </div>
        </div>
    </body>
</html>
