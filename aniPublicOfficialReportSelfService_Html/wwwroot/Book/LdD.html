<html>
    <head>
        <title>Life demanded Death</title>
        <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
        <script type="module" src="LdD.js"></script>
        <link rel="stylesheet" href="LdD.css">
        <script>
            const uisz=()=>book.sz(window.innerWidth,window.innerHeight);
            const uishow=(c,on)=>{c.style.display=on?'inline':'none';return on;}
            const book= {
                s:(pdf,src)=>{
                    nav.DisButtons();
                    book.pdf=pdf;
                    book.src=src;
                    uishow(_fBook,!uishow(_cBook,pdf))
                    nav.UpdButtons();
                    return pdf?book.sPdf(src):book.sExt(src);
                }
                ,sExt:src=> _fBook.src=src
                ,sPdf:async src=>await window.cBook.DoShow(src, 1, window.innerWidth*2)
                ,aRatio:(2*4.13)/5.83 // Golden ratio
                ,szWH:(w,h)=>{
                    if(nMt.innerText!='⏶') 
                        _cBook.style.top = _fBook.style.top = (window.innerHeight-h)/2+'px';
                    _fBook.style.width = w+'px';
                    _fBook.style.height = h+'px';
                    _cBook.width = w;
                    _cBook.height = h;
                    book.hAlign.Scroll();
                }
                ,szW:w=>book.szWH(w,w/book.aRatio)
                ,sz:(w,h)=>{
                    if(book.pdf) return book.sPdf(book.src);
                    w*=2; // Adjust so double as wide as needed (so that iframe and canvas only show half!)
                    //
                    book.szW(w);
                }
                ,hAlign:{
                    _:true
                    ,L:l=> {
                        book.hAlign._=l;
                        nLg.innerText=l?'🇳🇴':'🇬🇧';
                        _fBook.style.left=(l?0:(_dBook.clientWidth-_fBook.offsetWidth))+'px';
                        book.hAlign.Scroll();
                    }
                    ,Scroll:()=>_dBook.scrollLeft=book.hAlign._?0:_dBook.scrollWidth-_dBook.clientWidth
                }
                ,Page:pn=>{                    
                    nGoTxt.value = pn;
                    cBook.Page(pn, true);
                }
                ,pn:()=>cBook.pn
                ,np:()=>cBook.pdf?.numPages
            }
            const nav={
                Able:(c, en)=>{c.classList.toggle('disabled', !en);return en;}
                ,UpdButtons:()=>{
                    nav.Able(nPv, nav.Able(nFt, (book.pn()>1)));
                    nav.Able(nUp, nav.Able(nUp2, nav.Able(nUp3, (book.pn()>1 || window.scrollY > 0))));
                    nav.Able(nGo, true);
                    nav.Able(nDn, (book.pn()<book.np() || window.scrollY < document.documentElement.scrollHeight - window.innerHeight));
                    nav.Able(nLt, nav.Able(nNt, nav.Able(nNt2, nav.Able(nNt3, (book.pn()<book.np())))));
                    nav.Able(nFd, false);
                    nav.Able(nEx, false);
                }
                ,DisButtons:()=>nav.Able(nPv, nav.Able(nFt, nav.Able(nUp, nav.Able(nGo, nav.Able(nDn, nav.Able(nLt, nav.Able(nNt, nav.Able(nFd, nav.Able(nNt2, nav.Able(nUp2, nav.Able(nNt3, nav.Able(nUp3, nav.Able(nEx
                            , false)))))))))))))
                ,Share:async s=>{
                    s=s??_dShare.style.display=='none';
                    if (s) cBook.QrUrlScrollY = window.scrollY; // save vertical position for QR link
                    if (uishow(_dShare,!uishow(_cBook,nav.Able(nLg, !s)))) {
                        nav.DisButtons();
                        ShDeepL.href = await window.cBook.QrUrl();
                        window.scrollTo(window.scrollX, 0);
                    } else {
                        nav.UpdButtons();
                    }
                }
                ,Page:async pn=>{
                    nav.DisButtons();
                    await book.Page(pn);
                    window.scrollTo(window.scrollX, 0);
                    nav.UpdButtons();
                }
                ,EdPage:async()=>{
                    nGoTxt.value = book.pn();
                    uishow(nGoTxt,!uishow(nGo, false));
                    nGoTxt.focus(); // sync focus within the user gesture => iOS shows keyboard
                    nGoTxt.select();
                }
                ,PageEd:async ()=>{
                    const n = parseInt(nGoTxt.value);
                    if (!isNaN(n))
                        await nav.Page(n);
                    uishow(nGoTxt,!uishow(nGo, true));
                }
                ,ScrollUp:async ()=>{
                    if (window.scrollY <= 1) {// already at top
                        await book.Page(book.pn() - 1);
                        window,scrollTo(window.scrollX, document.documentElement.scrollHeight - window.innerHeight);
                    }
                    else {
                        window.scrollBy(0, -window.innerHeight*.75);
                    }
                    nav.UpdButtons();
                }
                ,ScrollDn:async()=>{
                    if (window.scrollY >= document.documentElement.scrollHeight-window.innerHeight - 1) {
                        await book.Page(book.pn() + 1);
                        window.scrollTo(window.scrollX, 0);
                    }
                    else
                        window.scrollBy(0, window.innerHeight*.75);
                    nav.UpdButtons();
                }
                ,ShowToc:()=>uishow(_dBook,!uishow(_dToc,_dToc.style.display=='none'))
                    ?nav.UpdButtons():nav.DisButtons()
                ,TocLn:(n,h,t)=>`<li><a href="javascript:nav.Page(${n});nav.ShowToc()"><h${h}>${n}. ${t}</h${h}></a></li>`
                ,Toc:book=>`<h1>Liv krevde død<br/>Life demanded Death'</h1><ul>`
                // <li><a href="javascript:nav.Page(1);nav.ShowToc()">1. Life demanded Death</a></li>
                // {book.map((b,i)=>nav.TocLn(i+1,1,b)).join('')}</ul>`
                // // Should stay within 
                ,menu:()=>{
                    let h=nMt.innerText!='⏶';
                    nMt.innerText=h?'⏶':'⏷';
                    nSh.style.scale=h?1:.7;
                    uishow(nLg,
                        uishow(nFt,uishow(nPv,
                        uishow(nUp,uishow(nGo,
                        uishow(nTc,uishow(nDn,
                        uishow(nNt,uishow(nLt,
                        uishow(nFd,
                        uishow(nEx,h))
                        )))))))));
                }
                ,btSimul:(a,i)=>{
                    if(i>=a.length) return;
                    const c=a[i], b=document.getElementById(c);
                    if(b) b.onmousedown();
                    else if(c=="w") return setTimeout(() => nav.btSimul(a, i+2), a[i+1]??1000);
                    else if(c=="s")
                        window.scrollTo(window.scrollX, a[(++i)]);
                    else console.log(`btSimul ${c} button not found`);
                    nav.btSimul(a,i+1);
                }
            }
            async function loaded() {
                nav.menu();
                // Parseparameters from URL
                const sp = new URLSearchParams(window.location.search);
                let bookU=sp.get('book') || 'LifeDemandedDeath.pdf'
                    ,bookT=parseInt(sp.get('bookT')) || 1
                    ,page=parseInt(sp.get('page')) || 1;
                // Set initial size, load book, adjust size and update buttons
                uisz();
                await book.s(1,bookU); //alt for google doc: book.s(0,'https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/embed?start=false&loop=false&rm=minimal');
                nav.Page(page);
                uisz();
                nav.btSimul(sp.get('c')?.split(',') || [], 0);
                nav.UpdButtons();
            }
            window.onresize=uisz;
        </script>
    </head>
    <body onload="loaded()">
        <div class="bookControls" style="z-index:1;text-align:center;">
            <button id="nMt" onmousedown="nav.menu()" style="padding-left:2vw;padding-right:2vw;scale:.7;">⏶</button>
            <button id="nFt" onmousedown="nav.Page(1)">⏮️</button>
                <button id="nPv" onmousedown="nav.Page(book.pn()-1)">◀️</button>
                <button id="nUp" onmousedown="nav.ScrollUp()">⏫</button>
                <button id="nGo" onmousedown="nav.EdPage()">🔢</button>
                    <input id="nGoTxt" class="pageNo" type="text" inputmode="numeric" value="1" onchange="nav.PageEd()" onkeydown="if(event.key=='Enter') nav.PageEd()"/>
                <button id="nDn" onmousedown="nav.ScrollDn()">⏬</button>
                <button id="nNt" onmousedown="nav.Page(book.pn()+1)">▶️</button>
                <button id="nLt" onmousedown="nav.Page(book.np())">⏭️</button>
            &nbsp;&nbsp;<button id="nFd" class="disabled" onmousedown="nav.find()">🔍</button>
                <button id="nSh" onmousedown="nav.Share()">📲</button>
                <button id="nEx" class="disabled" onmousedown="nav.export()">📤</button>
            <button id="nLg" onmousedown="book.hAlign.L(!book.hAlign._)">🇳🇴</button>
            &nbsp;&nbsp;<button id="nTc" class="disabled" onmousedown="nav.ShowToc()">📚</button>
        </div>
        <div id="_dBook" class="bookParent">
            <iframe id="_fBook" frameborder="0" allowfullscreen></iframe>
            <canvas id="_cBook"></canvas>
            <button id="nUp2" onmousedown="nav.ScrollUp()">⏫</button>
            <button id="nUp3" onmousedown="nav.ScrollUp()">⏫</button>
            <button id="nNt2" onmousedown="nav.Page(book.pn()+1)">▶️</button>
            <button id="nNt3" onmousedown="nav.Page(book.pn()+1)">▶️</button>
        </div>
        <div id="_dShare" class="shareParent" style="display:none;">
            <center><table><tr><td><a href="https://gormb.github.io/aniPublicOfficialReportSelfService/aniPublicOfficialReportSelfService_Html/wwwroot/Book">Book</a>
                    <td><img id="qr" class="qr" src="qr.png"/></td></tr>
                <tr><td><a id="ShDeepL" href="#">Deep </a></td>
                    <td><img id="qrd" class="qr" src="qr_int2.png"/></td></tr></table>
            </center>
        </div>
        <div id="_dToc" class="tocParent" style="display:none;">
            <center>
                <h1>Table of Contents</h1>
                <ul>
                    <li><a href="javascript:nav.Page(1);nav.ShowToc()">1. Life demanded Death</a></li>
                </ul>
            </center>
        </div>
        <div id="_dExport" style="display:none;">
            <div id="_dExportTxt" contenteditable="true" style="">
                Teksten din her...
            </div>
        </div>
    </body>
</html>
