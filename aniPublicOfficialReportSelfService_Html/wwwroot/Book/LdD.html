<html>
    <head>
        <title>Life demanded Death</title>
        <script type="module" src="LdD.js"></script>
        <script>
            let pdfRendererReadyResolve;
            const pdfRendererReady=new Promise(resolve=>pdfRendererReadyResolve=resolve);
            const uisz=()=>book.sz(window.innerWidth,window.innerHeight);
            const uishow=(c,on)=>c.style.display=on?'block':'none'
            const book= { 
                s:(pdf,src)=>{
                    book.pdf=pdf;
                    book.src=src;
                    uishow(_cBook,pdf);
                    uishow(_fBook,!pdf);
                    return pdf?book.sPdf(src):book.sExt(src);
                }
                ,sExt:src=> _fBook.src=src
                ,sPdf:async src=>{
                    const cShow=await pdfRendererReady;
                    return cShow(src,window.innerHeight-_dBook.offsetTop);
                }
                ,aRatio:(2*4.13)/5.83
                ,szH:h=>{
                    _fBook.style.width = h*book.aRatio+'px';
                    _fBook.style.height = h+'px';
                    console.log('book.szH',h);
                    book.hAlignScroll();
                }
                ,szW:w=> {
                    _fBook.style.width = w+'px';
                    _fBook.style.height = w/book.aRatio+'px';
                    console.log('book.szW',w);
                    book.hAlignScroll();
                }
                ,sz:(w,h)=>{
                    if(book.pdf) return book.sPdf(book.src);
                    w*=2; // Adjust so double as wide as needed (so that iframe only show half!)
                    h=h-_dBook.offsetTop;
                    if (w/2 > h*book.aRatio) book.szH(h); 
                    else book.szW(w);
                }
                ,_hAlignL:true
                ,hAlignL:l=> {
                    book._hAlignL=l;
                    _fBook.style.left=(l?0:(_dBook.clientWidth-_fBook.offsetWidth))+'px';
                    book.hAlignScroll();
                }
                ,hAlignScroll:()=>_dBook.scrollLeft=book._hAlignL?0:_dBook.scrollWidth-_dBook.clientWidth
            }
        </script>
    </head>
    <body>
        <button onmousedown="book.hAlignL(true)" style="font-size:2vh;padding:2vh;">🇳🇴</button>
        <button onmousedown="book.hAlignL(false)" style="font-size:2vh;padding:2vh;">🇬🇧</button>
        <div id="_dBook" style="overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x">
            <iframe id="_fBook" frameborder="0" allowfullscreen></iframe>            
            <canvas id="_cBook"></canvas>
        </div>
        <script>
            uisz();
            //book.s(0,'https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/embed?start=false&loop=false&rm=minimal');
            book.s(1,'LdD/LifeDemandedDeath.pdf');
            window.addEventListener('resize',uisz);
        </script>
    </body>
</html>
