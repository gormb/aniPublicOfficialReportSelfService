name: Sync Google Presentation to PDF

on:
  schedule:
    - cron: '0 0 * * *' # Auto-syncs daily at midnight UTC
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  download-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Export Presentation to PDF
        run: |
          curl -L "https://docs.google.com/presentation/d/1Dj4i3odXkr-vsFPmS6U7od1QKKLdxJyMNF35ahfqNZc/export/pdf" -o "LifeDemandedDeath.pdf"

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LifeDemandedDeath.pdf
          
          if git diff --staged --quiet; then
            echo "No changes in Google Presentation."
          else
            git commit -m "auto: update LifeDemandedDeath.pdf from Google Slides"
            git push origin master
          fi